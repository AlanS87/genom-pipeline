name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # deeponto wraps the OWL API (Java) via JPype/py4j, so a JVM is
      # required even just to import genom_pipeline.exact_matcher.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # This is the actual "fresh user" check: install exactly the way the
      # README's Quick Start tells people to, with no pre-warmed cache.
      - name: Install genom_pipeline
        run: pip install -e ".[dev]"

      - name: Smoke test - package imports cleanly
        run: python -c "from genom_pipeline import run_pipeline, PipelineResult; print('import OK')"

      # Regression test for the "from github.genom_pipeline..." bug: calling
      # run_pipeline() must fail on bad ontology paths with a normal
      # exception, never with ImportError/ModuleNotFoundError.
      - name: Smoke test - run_pipeline fails past the import stage
        run: |
          python -c "
          from genom_pipeline import run_pipeline
          try:
              run_pipeline(
                  src_onto_path='does_not_exist_src.owl',
                  tgt_onto_path='does_not_exist_tgt.owl',
                  workdir='/tmp/genom_ci_smoke',
                  run_definition=False,
              )
          except (ImportError, ModuleNotFoundError) as e:
              raise SystemExit(f'REGRESSION: run_pipeline raised {type(e).__name__}: {e}')
          except Exception as e:
              print(f'OK: run_pipeline failed past the import stage with {type(e).__name__}: {e}')
          "

      - name: Run test suite
        run: pytest -v
